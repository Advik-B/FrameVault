name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Codec core (no FFmpeg)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04 }
          - { name: macOS arm64, os: macos-14 }
          - { name: Windows x86_64, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240 # the first Windows run builds FFmpeg from source
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Test (includes H.264 and H.265 round trips through libav)
        run: cargo test
      - name: CLI smoke test
        shell: bash
        run: |
          bin=target/release/framevault
          head -c 4096 /dev/urandom > smoke.bin
          for codec in h264 h265; do
            "$bin" encode smoke.bin "smoke-$codec.mp4" --codec "$codec"
            mkdir -p "out-$codec"
            "$bin" decode "smoke-$codec.mp4" "out-$codec"
            cmp smoke.bin "out-$codec/smoke.bin"
          done

  web:
    name: WebAssembly + browser demo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build wasm package
        working-directory: web
        run: npm ci && npm run build:wasm
      - name: Build demo
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: framevault-web
          path: web/dist
