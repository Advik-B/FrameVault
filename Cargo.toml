[package]
name = "framevault"
version = "2.1.0"
edition = "2021"
description = "Encode arbitrary files into YouTube-survivable video (video block channel with Reed-Solomon ECC)"
readme = "README.md"
license = "MIT"

[dependencies]
# Reed-Solomon over GF(2^8) with erasure support (per-block model, matches the
# original reedsolo usage). Validated against variable-length blocks + 32 erasures.
reed-solomon = "0.2"
# QR metadata frame generation.
qrcode = "0.14"
# Pure-Rust QR detection/decode (replaces cv2 + pyzbar).
rqrr = "0.9"
# Data-parallelism for RS blocks and frame generation/analysis.
rayon = "1"
# Metadata (de)serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 payload integrity.
sha2 = "0.10"
anyhow = "1"

# ---- Native-only (the default `native` feature): libav I/O, filesystem, RAM detection
# and the CLI. Without it the codec core builds anywhere, including wasm32 (see `wasm/`).
clap = { version = "4", features = ["derive"], optional = true }
# System RAM detection, for the default memory budget (n% of total RAM).
sysinfo = { version = "0.32", optional = true }
# Atomic-rename output files (decode streams straight to a temp file, then persists it).
tempfile = { version = "3", optional = true }
# libav bindings (no subprocess). Pinned to the 6.1 line to match FFmpeg 6.1.x.
ffmpeg-next = { version = "6.1", optional = true }

# On Windows, statically link FFmpeg (+ libx264/libx265) into the binary so no FFmpeg DLLs
# are shipped. The dev libraries come from vcpkg (x64-windows-static-md); see
# scripts/setup-windows.ps1 and .cargo/config.toml. Cargo unions this feature with
# the base dependency above, so non-Windows targets keep dynamic linking.
[target.'cfg(windows)'.dependencies]
ffmpeg-next = { version = "6.1", features = ["static"], optional = true }

[features]
default = ["native"]
native = ["dep:clap", "dep:sysinfo", "dep:tempfile", "dep:ffmpeg-next"]

[[bin]]
name = "framevault"
path = "src/main.rs"
required-features = ["native"]

[[test]]
name = "roundtrip"
required-features = ["native"]

[[test]]
name = "media_spike"
required-features = ["native"]

[profile.release]
opt-level = 3       # optimize for speed (not size)
lto = true
codegen-units = 1

# Optimize the codec's hot pixel loops even in dev/test builds so the libav
# round-trip integration tests run at a reasonable speed.
[profile.dev.package.framevault]
opt-level = 3

[profile.test.package.framevault]
opt-level = 3

[workspace]
members = [".", "wasm"]
# Plain `cargo build` / `cargo test` stay native-only; the wasm crate is built with wasm-pack.
default-members = ["."]
